// 应用模块配置
// 目标:安卓 4.2.2(API 17)车机,1024x600 横屏

plugins {
    id 'com.android.application'
}

android {
    namespace 'com.captiva.musicplayer'
    compileSdk 30

    defaultConfig {
        applicationId "com.captiva.musicplayer"
        // 核心:最低支持安卓 4.2.2(科帕奇 15 款改装车机)
        minSdk 17
        // target 不宜过高,避免触发新权限模型带来的兼容问题
        targetSdk 28
        versionCode 1
        versionName "1.0"

        // 老系统 multidex 支持
        multiDexEnabled true
    }

    // JDK 8 兼容
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    // 选用 2021 年发布的版本,确保 minSdk=14
    // 2023 年后的新版 AndroidX 已把 minSdk 提到 21,无法在安卓 4.0 运行
    // appcompat 1.3.1 / recyclerview 1.2.1 仍支持 API 14
    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'
    implementation 'androidx.multidex:multidex:2.0.1'
}
