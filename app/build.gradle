// 应用模块配置
// 目标:安卓 4.2.2(API 17)车机,1024x600 横屏

plugins {
    id 'com.android.application'
}

/**
 * 获取 git commit 数量作为 versionCode
 * 每次提交自动 +1,保证单调递增,可覆盖安装
 * 无 git 环境时回退到 1
 */
static int getGitVersionCode() {
    try {
        def process = "git rev-list --count HEAD".execute()
        process.waitFor()
        if (process.exitValue() == 0) {
            return process.text.trim().toInteger()
        }
    } catch (Exception ignored) {
    }
    return 1
}

/**
 * 版本名:1.0.<commit数>(<短hash>)
 * 方便用户识别具体版本
 */
static String getGitVersionName() {
    String base = "1.0"
    try {
        def countProc = "git rev-list --count HEAD".execute()
        countProc.waitFor()
        def hashProc = "git rev-parse --short HEAD".execute()
        hashProc.waitFor()
        if (countProc.exitValue() == 0 && hashProc.exitValue() == 0) {
            String count = countProc.text.trim()
            String hash = hashProc.text.trim()
            return "${base}.${count}(${hash})"
        }
    } catch (Exception ignored) {
    }
    return base
}

android {
    namespace 'com.captiva.musicplayer'
    compileSdk 30

    // 固定签名:本地和 CI 用同一密钥,确保 APK 签名一致可覆盖安装
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'captiva123'
            keyAlias 'debug'
            keyPassword 'captiva123'
        }
    }

    defaultConfig {
        applicationId "com.captiva.musicplayer"
        // 核心:最低支持安卓 4.2.2(科帕奇 15 款改装车机)
        minSdk 17
        // target 不宜过高,避免触发新权限模型带来的兼容问题
        targetSdk 28
        // 自动递增:每次 git 提交 versionCode +1,支持覆盖安装
        versionCode getGitVersionCode()
        versionName getGitVersionName()

        // 老系统 multidex 支持
        multiDexEnabled true
    }

    // JDK 8 兼容
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    // 选用 2021 年发布的版本,确保 minSdk=14
    // 2023 年后的新版 AndroidX 已把 minSdk 提到 21,无法在安卓 4.0 运行
    // appcompat 1.3.1 / recyclerview 1.2.1 仍支持 API 14
    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'
    implementation 'androidx.multidex:multidex:2.0.1'
}
