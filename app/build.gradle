// 应用模块配置
// 目标:安卓 4.2.2(API 17)车机,1024x600 横屏

plugins {
    id 'com.android.application'
}

/**
 * 获取 versionCode
 *
 * CI 环境(GitHub Actions):使用 GITHUB_RUN_NUMBER + 100000
 *   - run number 每次构建自动递增,不分分支,保证跨分支单调递增
 *   - 加 100000 基数确保 > 之前所有 git-commit 版本号(最大约 189)
 *   - 解决 local-test commit 数 < main 导致降级安装失败的问题
 *
 * 本地构建:用 git commit 数量
 *   - 每次提交自动 +1,保证单调递增
 *   - 无 git 环境时回退到 1
 */
static int getGitVersionCode() {
    // CI 环境:优先使用 GitHub Actions run number
    String runNumber = System.getenv('GITHUB_RUN_NUMBER')
    if (runNumber != null && !runNumber.isEmpty()) {
        try {
            return 100000 + runNumber.toInteger()
        } catch (Exception ignored) {
        }
    }

    // 本地构建:用 git commit 数量
    try {
        def process = "git rev-list --count HEAD".execute()
        process.waitFor()
        if (process.exitValue() == 0) {
            return process.text.trim().toInteger()
        }
    } catch (Exception ignored) {
    }
    return 1
}

/**
 * 版本名(优先级从高到低):
 * 1. CI 注入:GitHub Actions 在构建前算好与预发布 tag 同源的版本名,
 *    经 APP_VERSION_NAME 环境变量传入 —— 保证 APK 内嵌版本名与
 *    release 标签/update.json 的 versionName 完全一致(如 5.7.403-pre)
 * 2. HEAD 精确 tag(如 v3.0)→ 3.0
 * 3. describe:<tag>.dev<N>(<hash>);【注意】tag 本身可含连字符
 *    (如 v5.7.400-pre),必须用正则从右侧解析,不能 split("-")
 * 4. 完全无 git → dev
 */
static String getGitVersionName() {
    // 1) CI 注入(最优先)
    String injected = System.getenv('APP_VERSION_NAME')
    if (injected != null && !injected.isEmpty()) {
        return injected
    }
    try {
        // 2) HEAD 上的精确 tag
        def tagProc = "git describe --tags --exact-match HEAD".execute()
        tagProc.waitFor()
        if (tagProc.exitValue() == 0) {
            String tag = tagProc.text.trim()
            // 去掉 v 前缀
            if (tag.startsWith("v")) {
                return tag.substring(1)
            }
            return tag
        }

        // 3) describe(最近 tag + commit 数)
        def descProc = "git describe --tags --long".execute()
        descProc.waitFor()
        if (descProc.exitValue() == 0) {
            String desc = descProc.text.trim()
            // 格式:<tag>-<ahead>-g<hash>,tag 自身可含连字符(如 v5.7.400-pre)
            // 必须用贪婪前缀 + 锚定尾部的正则,禁止 split("-")(会拆碎含连字符的 tag)
            def m = (desc =~ /^(.++)-(\d++)-g([0-9a-f]+)$/)
            if (m.matches()) {
                String tag = m.group(1)
                int ahead = m.group(2).toInteger()
                String hash = m.group(3)
                if (tag.startsWith("v")) tag = tag.substring(1)
                if (ahead == 0) {
                    return tag
                }
                return "${tag}.dev${ahead}(${hash})"
            }
        }

        // 4) 完全没有 tag,用 dev 格式
        def countProc = "git rev-list --count HEAD".execute()
        countProc.waitFor()
        def hashProc = "git rev-parse --short HEAD".execute()
        hashProc.waitFor()
        if (countProc.exitValue() == 0 && hashProc.exitValue() == 0) {
            String count = countProc.text.trim()
            String hash = hashProc.text.trim()
            return "dev.${count}(${hash})"
        }
    } catch (Exception ignored) {
    }
    return "dev"
}

android {
    namespace 'com.captiva.musicplayer'
    compileSdk 30

    // 固定签名:本地和 CI 用同一密钥,确保 APK 签名一致可覆盖安装
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'captiva123'
            keyAlias 'debug'
            keyPassword 'captiva123'
            // 安卓 4.2.2 只支持 v1(JAR)签名
            // v2(APK Signature Scheme v2,Android 7.0+)必须禁用
            // v3 依赖 v2,v2 禁用后 v3 不会生效
            // v4 仅用于增量安装(adb --incremental),不影响 APK 文件本身
            v1SigningEnabled true
            v2SigningEnabled false
        }
    }

    defaultConfig {
        applicationId "com.captiva.musicplayer"
        // 核心:最低支持安卓 4.2.2(科帕奇 15 款改装车机)
        minSdk 17
        // target 不宜过高,避免触发新权限模型带来的兼容问题
        targetSdk 28
        // 自动递增:每次 git 提交 versionCode +1,支持覆盖安装
        versionCode getGitVersionCode()
        versionName getGitVersionName()

        // 老系统 multidex 支持
        multiDexEnabled true
    }

    // JDK 8 兼容
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // 本应用面向安卓 4.2.2 科帕奇车机,采用 sideload(U盘)安装,不走 Google Play。
    // 因此 Google Play 的 "targetSdk 必须 >= 31" 政策不适用;关闭 release 构建的 lint 致命检查,
    // 避免 assembleRelease 因 ExpiredTargetSdkVersion 而失败。minSdk=17 不变,车机仍可正常运行。
    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    // 选用 2021 年发布的版本,确保 minSdk=14
    // 2023 年后的新版 AndroidX 已把 minSdk 提到 21,无法在安卓 4.0 运行
    // appcompat 1.3.1 / recyclerview 1.2.1 仍支持 API 14
    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'
    implementation 'androidx.multidex:multidex:2.0.1'
}
