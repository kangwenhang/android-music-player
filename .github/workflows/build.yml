name: Build and Release Android APK

on:
  # 推送即触发自动构建
  push:
    branches:
      - local-test
  # 保留手动触发
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-30 build-tools;30.0.3'

      - name: Install Gradle 7.5
        run: |
          wget -q https://services.gradle.org/distributions/gradle-7.5-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/
          echo "/tmp/gradle-7.5/bin" >> $GITHUB_PATH

      - name: Build Debug APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: gradle assembleDebug --no-daemon --no-build-cache

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: captiva-music-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          TAG="v$(date +'%Y%m%d-%H%M%S')"

          # 通过 GitHub API 获取上一个 Release 的 tag(最可靠)
          # gh api 返回所有 release(含 prerelease),按创建时间降序
          PREV_TAG=$(gh api "repos/${{ github.repository }}/releases?per_page=1" --jq '.[0].tag_name' 2>/dev/null || echo "")
          echo "上一个 Release tag: ${PREV_TAG:-无}"

          # 确保上一个 tag 在本地存在(用于 git log 范围查询)
          if [ -n "$PREV_TAG" ]; then
            git fetch origin "refs/tags/${PREV_TAG}:refs/tags/${PREV_TAG}" 2>/dev/null || true
          fi

          # 只显示自上次 Release 以来的新 commit
          if [ -n "$PREV_TAG" ] && git rev-parse "$PREV_TAG" >/dev/null 2>&1; then
            CHANGELOG=$(git log --pretty=format:"- %s" "${PREV_TAG}..HEAD" 2>/dev/null | grep -v "^- Merge" || true)
            echo "找到 ${PREV_TAG}, 提取新 commit..."
          else
            # 没有上一个 Release,只取最近 3 条
            CHANGELOG=$(git log --pretty=format:"- %s" -3 | grep -v "^- Merge" || true)
            echo "未找到上一个 Release, 只显示最近 3 条"
          fi

          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="- 无代码变更(重新构建)"
          fi

          echo "本次更新内容:"
          echo "$CHANGELOG"

          # 获取构建时间
          BUILD_TIME=$(date +'%Y-%m-%d %H:%M:%S %Z')

          # 从 APK 提取版本信息(versionCode 递增,支持覆盖安装)
          APK_INFO=$(aapt dump badging "$APK_PATH" 2>/dev/null | grep -E "versionCode|versionName" | head -1 || echo "")
          echo "APK 版本信息: ${APK_INFO:-未知}"

          # 生成 Release 说明
          cat > /tmp/release_notes.md << EOF
          ## 构建信息
          - 构建时间: ${BUILD_TIME}
          - 版本标签: ${TAG}
          - 构建类型: Debug
          - 版本信息: ${APK_INFO}

          ## 本次更新
          ${CHANGELOG}

          ## 安装说明
          下载 APK 后传输到车机安装即可。
          每次构建 versionCode 自动递增,可直接覆盖安装。
          EOF

          gh release create "$TAG" "$APK_PATH" \
            --title "科帕奇音乐播放器 ${TAG}" \
            --notes-file /tmp/release_notes.md \
            --prerelease
