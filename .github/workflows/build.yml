name: Build and Release Android APK

on:
  # 仅手动触发,不再每次 push 自动构建
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-30 build-tools;30.0.3'

      - name: Install Gradle 7.5
        run: |
          wget -q https://services.gradle.org/distributions/gradle-7.5-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/
          echo "/tmp/gradle-7.5/bin" >> $GITHUB_PATH

      - name: Build Debug APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: gradle assembleDebug --no-daemon --no-build-cache

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: captiva-music-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          TAG="v$(date +'%Y%m%d-%H%M%S')"
          gh release create "$TAG" "$APK_PATH" \
            --title "科帕奇音乐播放器 $TAG" \
            --notes "手动触发构建版本

          更新内容:
          - 歌词叠加在封面上(封面作为底色背景)
          - 移除振动反馈,改用水波纹点击反馈
          - 搜索改为按钮触发(默认隐藏,点击展开)
          - 内置简易输入法(适配车机输入法问题)" \
            --prerelease
