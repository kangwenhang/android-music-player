name: Build and Release Android APK

on:
  # 仅手动触发,不再每次 push 自动构建
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-30 build-tools;30.0.3'

      - name: Install Gradle 7.5
        run: |
          wget -q https://services.gradle.org/distributions/gradle-7.5-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/
          echo "/tmp/gradle-7.5/bin" >> $GITHUB_PATH

      - name: Build Debug APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: gradle assembleDebug --no-daemon --no-build-cache

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: captiva-music-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          TAG="v$(date +'%Y%m%d-%H%M%S')"

          # 动态生成更新内容:取最近 20 条 commit 的信息
          CHANGELOG=$(git log --pretty=format:"- %s" -20 | grep -v "^- Merge" || true)
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="- 手动触发构建版本"
          fi

          # 获取构建时间
          BUILD_TIME=$(date +'%Y-%m-%d %H:%M:%S %Z')

          # 生成 Release 说明
          cat > /tmp/release_notes.md << EOF
          ## 构建信息
          - 构建时间: ${BUILD_TIME}
          - 版本标签: ${TAG}
          - 构建类型: Debug

          ## 更新内容
          ${CHANGELOG}

          ## 安装说明
          下载 APK 后传输到车机安装即可。
          EOF

          gh release create "$TAG" "$APK_PATH" \
            --title "科帕奇音乐播放器 ${TAG}" \
            --notes-file /tmp/release_notes.md \
            --prerelease
