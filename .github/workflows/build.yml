name: Build and Release Android APK

on:
  # 推送即触发自动构建
  push:
    branches:
      - main
      - local-test
  # 保留手动触发
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch all tags (ensure version name correct)
        run: git fetch --tags --force

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-30 build-tools;30.0.3'

      - name: Install Gradle 7.5
        run: |
          wget -q https://services.gradle.org/distributions/gradle-7.5-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/
          echo "/tmp/gradle-7.5/bin" >> $GITHUB_PATH

      - name: Build Debug APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: gradle assembleDebug --no-daemon --no-build-cache

      - name: Zipalign + Re-sign APK (v1 only, for Android 4.2.2)
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/*/ 2>/dev/null | sort -V | tail -1)
          echo "Build tools: ${BUILD_TOOLS:-not found}"
          ZIPALIGN="${BUILD_TOOLS}zipalign"
          APKSIGNER="${BUILD_TOOLS}apksigner"
          APK_SRC=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          APK_ALIGNED="/tmp/app-aligned.apk"
          APK_FINAL=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)

          # 1. Zipalign(4字节边界对齐,安卓 4.2.2 要求)
          echo "=== Step 1: Zipalign ==="
          if [ -f "$ZIPALIGN" ]; then
            "$ZIPALIGN" -f -v 4 "$APK_SRC" "$APK_ALIGNED" > /tmp/zipalign.log 2>&1 || {
              echo "zipalign failed, trying without verification"
              "$ZIPALIGN" -f 4 "$APK_SRC" "$APK_ALIGNED" 2>&1 || true
            }
            echo "zipalign entries: $(wc -l < /tmp/zipalign.log)"
            cp "$APK_ALIGNED" "$APK_FINAL"
            echo "Zipalign done."
          else
            echo "zipalign not found, skipping alignment"
          fi

          # 2. 用 apksigner 重新签名,只启用 v1
          echo "=== Step 2: Re-sign (v1 only) ==="
          if [ -f "$APKSIGNER" ]; then
            "$APKSIGNER" sign \
              --ks app/debug.keystore \
              --ks-pass pass:captiva123 \
              --key-pass pass:captiva123 \
              --ks-key-alias debug \
              --v1-signing-enabled true \
              --v2-signing-enabled false \
              --v3-signing-enabled false \
              --v4-signing-enabled false \
              "$APK_FINAL"

            echo "=== Step 3: Verify ==="
            "$APKSIGNER" verify -v "$APK_FINAL" 2>&1 || true
            echo ""
            echo "=== Alignment check ==="
            "$ZIPALIGN" -c -v 4 "$APK_FINAL" 2>&1 | tail -3 || echo "Alignment check warning (expected after signing)"
          else
            echo "apksigner not found, keeping original signing"
          fi
          echo "=== APK 处理完成 ==="
          echo "Final APK size: $(wc -c < "$APK_FINAL") bytes"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: captiva-music-debug
          path: app/build/outputs/apk/debug/*.apk

      # ========== local-test: 创建预发布(调试用) ==========
      - name: Create Prerelease (local-test)
        if: github.ref == 'refs/heads/local-test'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)

          # 查询最新正式版(prerelease=false)的 tag 作为基础版本
          LATEST_STABLE=""
          ALL_RELEASES=$(gh api "repos/${{ github.repository }}/releases?per_page=30" 2>/dev/null || echo "[]")
          LATEST_STABLE=$(echo "$ALL_RELEASES" | python3 -c "
          import sys, json
          try:
            data = json.load(sys.stdin)
            for r in data:
                if not r.get('prerelease', False):
                    print(r.get('tag_name', ''))
                    break
          except:
            pass
          " 2>/dev/null || echo "")
          echo "最新正式版: ${LATEST_STABLE:-无}"

          # 基于最新正式版生成预发布版本号
          # 去掉 v 前缀,取主版本号(如 2.0),加上 commit 数作为补丁号
          if [ -n "$LATEST_STABLE" ]; then
            BASE_VER=$(echo "$LATEST_STABLE" | sed 's/^v//' | cut -d. -f1-2)
          else
            BASE_VER="1.0"
          fi
          COMMIT_COUNT=$(git rev-list --count HEAD)
          TAG="v${BASE_VER}.${COMMIT_COUNT}-pre"
          echo "预发布版本标签: ${TAG}"

          # 获取上一个 Release 的 tag(用于 changelog)
          PREV_TAG=$(gh api "repos/${{ github.repository }}/releases?per_page=1" --jq '.[0].tag_name' 2>/dev/null || echo "")
          echo "上一个 Release tag: ${PREV_TAG:-无}"

          if [ -n "$PREV_TAG" ]; then
            git fetch origin "refs/tags/${PREV_TAG}:refs/tags/${PREV_TAG}" 2>/dev/null || true
          fi

          MAX_COMMITS=15
          if [ -n "$PREV_TAG" ] && git rev-parse "$PREV_TAG" >/dev/null 2>&1; then
            TOTAL_COUNT=$(git rev-list --count "${PREV_TAG}..HEAD" 2>/dev/null || echo "0")
            CHANGELOG=$(git log --pretty=format:"- %s" --max-count=${MAX_COMMITS} "${PREV_TAG}..HEAD" 2>/dev/null | grep -v "^- Merge" || true)
            echo "找到 ${PREV_TAG}, 共 ${TOTAL_COUNT} 条新 commit"
            if [ "$TOTAL_COUNT" -gt "$MAX_COMMITS" ]; then
              CHANGELOG="${CHANGELOG}"$'\n'"- ...还有 $((TOTAL_COUNT - MAX_COMMITS)) 条更早的更新"
            fi
          else
            CHANGELOG=$(git log --pretty=format:"- %s" -10 | grep -v "^- Merge" || true)
          fi

          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="- 无代码变更(重新构建)"
          fi

          BUILD_TIME=$(date +'%Y-%m-%d %H:%M:%S %Z')
          APK_INFO=$(aapt dump badging "$APK_PATH" 2>/dev/null | grep -E "versionCode|versionName" | head -1 || echo "")

          cat > /tmp/release_notes.md << EOF
          ## 调试预发布

          - 构建时间: ${BUILD_TIME}
          - 版本标签: ${TAG}
          - 基于正式版: ${LATEST_STABLE:-无}
          - 分支: local-test
          - 版本信息: ${APK_INFO}

          ## 本次更新
          ${CHANGELOG}

          ## 安装说明
          这是调试预发布版本,下载 APK 后传输到车机安装即可。
          每次构建 versionCode 自动递增,可直接覆盖安装。
          EOF

          # 删除同 tag 的旧预发布(如果存在),确保每次都是最新构建
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true

          gh release create "$TAG" "$APK_PATH" \
            --title "调试预发布 ${TAG}" \
            --notes-file /tmp/release_notes.md \
            --prerelease

      # ========== main: 创建正式发布 ==========
      - name: Create GitHub Release (main)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)

          # 优先使用 HEAD 上的 git tag 作为 Release 标签(如 v2.1)
          # 没有标签时回退到时间戳标签
          GIT_TAG=$(git describe --tags --exact-match HEAD 2>/dev/null || echo "")
          if [ -n "$GIT_TAG" ]; then
            TAG="$GIT_TAG"
            echo "使用 git tag 作为 Release 标签: $TAG"
          else
            TAG="v$(date +'%Y%m%d-%H%M%S')"
            echo "无 git tag,使用时间戳标签: $TAG"
          fi

          # 如果该 tag 已有 release,先删除旧 release(重新构建覆盖)
          EXISTING=$(gh release view "$TAG" --json id -q '.id' 2>/dev/null || echo "")
          if [ -n "$EXISTING" ]; then
            echo "删除旧的 Release $TAG,重新创建"
            gh release delete "$TAG" --yes 2>/dev/null || true
          fi

          PREV_TAG=$(gh api "repos/${{ github.repository }}/releases?per_page=1" --jq '.[0].tag_name' 2>/dev/null || echo "")
          echo "上一个 Release tag: ${PREV_TAG:-无}"

          if [ -n "$PREV_TAG" ]; then
            git fetch origin "refs/tags/${PREV_TAG}:refs/tags/${PREV_TAG}" 2>/dev/null || true
          fi

          MAX_COMMITS=15
          if [ -n "$PREV_TAG" ] && git rev-parse "$PREV_TAG" >/dev/null 2>&1; then
            TOTAL_COUNT=$(git rev-list --count "${PREV_TAG}..HEAD" 2>/dev/null || echo "0")
            CHANGELOG=$(git log --pretty=format:"- %s" --max-count=${MAX_COMMITS} "${PREV_TAG}..HEAD" 2>/dev/null | grep -v "^- Merge" || true)
            echo "找到 ${PREV_TAG}, 共 ${TOTAL_COUNT} 条新 commit"
            if [ "$TOTAL_COUNT" -gt "$MAX_COMMITS" ]; then
              CHANGELOG="${CHANGELOG}"$'\n'"- ...还有 $((TOTAL_COUNT - MAX_COMMITS)) 条更早的更新"
            fi
          else
            CHANGELOG=$(git log --pretty=format:"- %s" -10 | grep -v "^- Merge" || true)
          fi

          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="- 无代码变更(重新构建)"
          fi

          BUILD_TIME=$(date +'%Y-%m-%d %H:%M:%S %Z')
          APK_INFO=$(aapt dump badging "$APK_PATH" 2>/dev/null | grep -E "versionCode|versionName" | head -1 || echo "")

          cat > /tmp/release_notes.md << EOF
          ## 构建信息
          - 构建时间: ${BUILD_TIME}
          - 版本标签: ${TAG}
          - 构建类型: Debug
          - 版本信息: ${APK_INFO}

          ## 本次更新
          ${CHANGELOG}

          ## 安装说明
          下载 APK 后传输到车机安装即可。
          每次构建 versionCode 自动递增,可直接覆盖安装。
          EOF

          gh release create "$TAG" "$APK_PATH" \
            --title "科帕奇音乐播放器 ${TAG}" \
            --notes-file /tmp/release_notes.md \
            --latest
