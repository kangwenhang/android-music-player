name: Build and Release Android APK

on:
  # 推送即触发自动构建
  push:
    branches:
      - main
      - local-test
  # 保留手动触发
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch all tags (ensure version name correct)
        run: git fetch --tags --force

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-30 build-tools;30.0.3'

      - name: Install Gradle 7.5
        run: |
          wget -q https://services.gradle.org/distributions/gradle-7.5-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/
          echo "/tmp/gradle-7.5/bin" >> $GITHUB_PATH

      # ========== 决定构建类型 ==========
      # main      -> assembleRelease  (BuildConfig.DEBUG=false -> PerfLogger 性能监控关闭 = 关闭调试)
      # local-test-> assembleDebug    (BuildConfig.DEBUG=true  -> PerfLogger 性能监控开启, 用于卡顿分析)
      - name: Determine build type (main=Release 关闭调试 / local-test=Debug 性能监控)
        id: buildinfo
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "gradle_task=assembleRelease" >> "$GITHUB_OUTPUT"
            echo "apk_dir=app/build/outputs/apk/release" >> "$GITHUB_OUTPUT"
            echo "build_label=Release(调试关闭 / 性能监控禁用)" >> "$GITHUB_OUTPUT"
            echo "artifact_suffix=release" >> "$GITHUB_OUTPUT"
          else
            echo "gradle_task=assembleDebug" >> "$GITHUB_OUTPUT"
            echo "apk_dir=app/build/outputs/apk/debug" >> "$GITHUB_OUTPUT"
            echo "build_label=Debug(性能监控开启)" >> "$GITHUB_OUTPUT"
            echo "artifact_suffix=debug" >> "$GITHUB_OUTPUT"
          fi

      # ========== 构建前注入版本名(仅 local-test) ==========
      # 预发布 tag 是构建后才创建的,构建时 git describe 只能拿到上一个 tag,
      # 且旧解析代码遇到带连字符的 tag 会异常退化成 "dev"。
      # tag 公式 v<主>.<次>.<commit数>-pre 在构建前即可确定(基于 commit 数),
      # 这里提前算好注入 APP_VERSION_NAME,保证 APK 内嵌版本名与 release 标签
      # 及 update-debug.json 的 versionName 三者完全一致。
      - name: Compute APP_VERSION_NAME (local-test, 与预发布 tag 同源)
        if: github.ref == 'refs/heads/local-test'
        run: |
          LATEST_STABLE=$(git tag --list | grep -E '^v[0-9]+(\.[0-9]+)+$' | sort -V | tail -1)
          if [ -z "$LATEST_STABLE" ]; then
            BASE_VER="1.0"
            echo "警告: 未找到正式版 tag,基础版本回退为 1.0"
          else
            BASE_VER=$(echo "$LATEST_STABLE" | sed 's/^v//' | cut -d. -f1-2)
          fi
          COMMIT_COUNT=$(git rev-list --count HEAD)
          echo "APP_VERSION_NAME=${BASE_VER}.${COMMIT_COUNT}-pre" >> "$GITHUB_ENV"
          echo "注入版本名: ${BASE_VER}.${COMMIT_COUNT}-pre"

      - name: Build APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: gradle ${{ steps.buildinfo.outputs.gradle_task }} --no-daemon --no-build-cache

      - name: Zipalign + Re-sign APK (v1 only, for Android 4.2.2)
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/*/ 2>/dev/null | sort -V | tail -1)
          echo "Build tools: ${BUILD_TOOLS:-not found}"
          ZIPALIGN="${BUILD_TOOLS}zipalign"
          APKSIGNER="${BUILD_TOOLS}apksigner"
          APK_DIR="${{ steps.buildinfo.outputs.apk_dir }}"
          APK_SRC=$(find "$APK_DIR" -name "*.apk" | head -1)
          APK_ALIGNED="/tmp/app-aligned.apk"
          APK_FINAL="$APK_SRC"

          # 1. Zipalign(4字节边界对齐,安卓 4.2.2 要求)
          echo "=== Step 1: Zipalign ==="
          if [ -f "$ZIPALIGN" ]; then
            "$ZIPALIGN" -f -v 4 "$APK_SRC" "$APK_ALIGNED" > /tmp/zipalign.log 2>&1 || {
              echo "zipalign failed, trying without verification"
              "$ZIPALIGN" -f 4 "$APK_SRC" "$APK_ALIGNED" 2>&1 || true
            }
            echo "zipalign entries: $(wc -l < /tmp/zipalign.log)"
            cp "$APK_ALIGNED" "$APK_FINAL"
            echo "Zipalign done."
          else
            echo "zipalign not found, skipping alignment"
          fi

          # 2. 用 apksigner 重新签名,只启用 v1
          echo "=== Step 2: Re-sign (v1 only) ==="
          if [ -f "$APKSIGNER" ]; then
            "$APKSIGNER" sign \
              --ks app/debug.keystore \
              --ks-pass pass:captiva123 \
              --key-pass pass:captiva123 \
              --ks-key-alias debug \
              --v1-signing-enabled true \
              --v2-signing-enabled false \
              --v3-signing-enabled false \
              --v4-signing-enabled false \
              "$APK_FINAL"

            echo "=== Step 3: Verify ==="
            "$APKSIGNER" verify -v "$APK_FINAL" 2>&1 || true
            echo ""
            echo "=== Alignment check ==="
            "$ZIPALIGN" -c -v 4 "$APK_FINAL" 2>&1 | tail -3 || echo "Alignment check warning (expected after signing)"
          else
            echo "apksigner not found, keeping original signing"
          fi
          echo "=== APK 处理完成 ==="
          echo "Final APK size: $(wc -c < "$APK_FINAL") bytes"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: captiva-music-${{ steps.buildinfo.outputs.artifact_suffix }}
          path: ${{ steps.buildinfo.outputs.apk_dir }}/*.apk

      # ========== local-test: 创建预发布(调试用) ==========
      - name: Create Prerelease (local-test)
        if: github.ref == 'refs/heads/local-test'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_PATH=$(find ${{ steps.buildinfo.outputs.apk_dir }} -name "*.apk" | head -1)

          # 基础版本:预发布 tag 的 v<主>.<次> 前缀
          # 注意:不要靠 release 列表去扫"最新正式版"。releases 接口按 created_at 排序,
          # 而预发布版本会持续堆到列表顶部,正式版被挤到 per_page 窗口之外,
          # 一旦扫不到就静默退化成 1.0(实际发生过:tag 变成 v1.0.285-pre)。
          # 改为直接在本地 tag(workflow 已 git fetch --tags)里找正式版标签,稳定且不耗 API 配额。
          LATEST_STABLE=$(git tag --list | grep -E '^v[0-9]+(\.[0-9]+)+$' | sort -V | tail -1)
          if [ -z "$LATEST_STABLE" ]; then
            LATEST_STABLE="无"
            BASE_VER="1.0"
            echo "警告: 未找到正式版 tag,基础版本回退为 1.0"
          else
            BASE_VER=$(echo "$LATEST_STABLE" | sed 's/^v//' | cut -d. -f1-2)
            echo "基础版本: ${BASE_VER} (来自正式版 tag ${LATEST_STABLE})"
          fi
          COMMIT_COUNT=$(git rev-list --count HEAD)
          TAG="v${BASE_VER}.${COMMIT_COUNT}-pre"
          echo "预发布版本标签: ${TAG}"

          # 获取上一个 Release 的 tag(用于 changelog)
          # 排除固定的"最新调试包"入口 tag:它不随构建前进,若被当成上一个版本会让 changelog 错乱
          PREV_TAG=$(gh api "repos/${{ github.repository }}/releases?per_page=20" \
            --jq '[.[] | select(.tag_name | endswith("-latest") | not)][0].tag_name' 2>/dev/null || echo "")
          echo "上一个 Release tag: ${PREV_TAG:-无}"

          if [ -n "$PREV_TAG" ]; then
            git fetch origin "refs/tags/${PREV_TAG}:refs/tags/${PREV_TAG}" 2>/dev/null || true
          fi

          MAX_COMMITS=15
          if [ -n "$PREV_TAG" ] && git rev-parse "$PREV_TAG" >/dev/null 2>&1; then
            TOTAL_COUNT=$(git rev-list --count "${PREV_TAG}..HEAD" 2>/dev/null || echo "0")
            CHANGELOG=$(git log --pretty=format:"- %s" --max-count=${MAX_COMMITS} "${PREV_TAG}..HEAD" 2>/dev/null | grep -v "^- Merge" || true)
            echo "找到 ${PREV_TAG}, 共 ${TOTAL_COUNT} 条新 commit"
            if [ "$TOTAL_COUNT" -gt "$MAX_COMMITS" ]; then
              CHANGELOG="${CHANGELOG}"$'\n'"- ...还有 $((TOTAL_COUNT - MAX_COMMITS)) 条更早的更新"
            fi
          else
            CHANGELOG=$(git log --pretty=format:"- %s" -10 | grep -v "^- Merge" || true)
          fi

          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="- 无代码变更(重新构建)"
          fi

          BUILD_TIME=$(date +'%Y-%m-%d %H:%M:%S %Z')
          APK_INFO=$(aapt dump badging "$APK_PATH" 2>/dev/null | grep -E "versionCode|versionName" | head -1 || echo "")

          cat > /tmp/release_notes.md << EOF
          ## 调试预发布

          - 构建时间: ${BUILD_TIME}
          - 版本标签: ${TAG}
          - 基于正式版: ${LATEST_STABLE:-无}
          - 分支: local-test
          - 构建类型: Debug(性能监控开启)
          - 版本信息: ${APK_INFO}

          ## 本次更新
          ${CHANGELOG}

          ## 安装说明
          这是调试预发布版本,下载 APK 后传输到车机安装即可。
          每次构建 versionCode 自动递增,可直接覆盖安装。
          EOF

          # ========== 双轨发布:版本化(可回溯) + 固定入口(链接稳定) ==========
          # 1) 版本化预发布:每次构建一个独立 tag,保留历史可回退
          #    - 已存在则覆盖上传(不再 delete+create:避免同名 tag 互相覆盖与静默失败)
          #    - --target 指定本次构建的 commit(此前缺省会让 tag 错误地指向 main HEAD)
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在,覆盖上传 APK"
            gh release upload "$TAG" "$APK_PATH" --clobber
            gh release edit "$TAG" --title "调试预发布 ${TAG}" \
              --notes-file /tmp/release_notes.md --prerelease
          else
            gh release create "$TAG" "$APK_PATH" \
              --target "$GITHUB_SHA" \
              --title "调试预发布 ${TAG}" \
              --notes-file /tmp/release_notes.md \
              --prerelease
          fi

          # 2) 固定入口:始终指向最新一次 local-test 构建,下载链接固定不变
          #    用常量名(不掺版本号),这样即使正式版基线变化,入口链接也永远不变
          LATEST_TAG="pre-latest"
          if gh release view "$LATEST_TAG" >/dev/null 2>&1; then
            echo "更新固定入口 $LATEST_TAG -> ${TAG}"
            gh release upload "$LATEST_TAG" "$APK_PATH" --clobber
            gh release edit "$LATEST_TAG" --title "最新调试包(${TAG})" \
              --notes-file /tmp/release_notes.md --prerelease
          else
            gh release create "$LATEST_TAG" "$APK_PATH" \
              --target "$GITHUB_SHA" \
              --title "最新调试包(${TAG})" \
              --notes-file /tmp/release_notes.md \
              --prerelease
          fi

          # 3) 让固定入口 tag 指向本次构建的 commit
          #    否则该 tag 会永远停在"第一次创建它"的那个 commit 上,
          #    点进 tag 看到的代码与包里的代码不一致(包是新的,代码是旧的)
          gh api --method PATCH "repos/${{ github.repository }}/git/refs/tags/${LATEST_TAG}" \
            -f sha="$GITHUB_SHA" -F force=true >/dev/null 2>&1 \
            || echo "警告: 固定入口 tag 未移动到最新 commit(不影响 APK 下载)"

          # 4) 校验产物确实挂上去了:某些情况下 gh 会"成功但不落库",
          #    这里显式断言,杜绝"步骤绿了但没包"的静默失败
          for T in "$TAG" "$LATEST_TAG"; do
            ASSETS=$(gh release view "$T" --json assets --jq '.assets | length' 2>/dev/null || echo 0)
            echo "校验 ${T}: assets=${ASSETS:-0}"
            if [ "${ASSETS:-0}" -lt 1 ]; then
              echo "::error::Release ${T} 未包含 APK 资产,发布失败"
              exit 1
            fi
          done
          echo "发布完成: ${TAG}(可回溯) + ${LATEST_TAG}(固定入口)"

      # ========== main: 创建正式发布 ==========
      - name: Create GitHub Release (main)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_PATH=$(find ${{ steps.buildinfo.outputs.apk_dir }} -name "*.apk" | head -1)

          # 优先使用 HEAD 上的 git tag 作为 Release 标签(如 v2.1)
          # 没有标签时回退到时间戳标签
          GIT_TAG=$(git describe --tags --exact-match HEAD 2>/dev/null || echo "")
          if [ -n "$GIT_TAG" ]; then
            TAG="$GIT_TAG"
            echo "使用 git tag 作为 Release 标签: $TAG"
          else
            TAG="v$(date +'%Y%m%d-%H%M%S')"
            echo "无 git tag,使用时间戳标签: $TAG"
          fi

          # 计算 changelog 基准:上一个 Release,需排除本次要发布的 tag(否则拿自己当基准,changelog 恒为空)
          PREV_TAG=$(gh api "repos/${{ github.repository }}/releases?per_page=20" \
            --jq "[.[] | select(.tag_name != \"$TAG\") | select(.tag_name | endswith(\"-latest\") | not)][0].tag_name // empty" 2>/dev/null || echo "")
          echo "上一个 Release tag: ${PREV_TAG:-无}"

          if [ -n "$PREV_TAG" ]; then
            git fetch origin "refs/tags/${PREV_TAG}:refs/tags/${PREV_TAG}" 2>/dev/null || true
          fi

          MAX_COMMITS=15
          if [ -n "$PREV_TAG" ] && git rev-parse "$PREV_TAG" >/dev/null 2>&1; then
            TOTAL_COUNT=$(git rev-list --count "${PREV_TAG}..HEAD" 2>/dev/null || echo "0")
            CHANGELOG=$(git log --pretty=format:"- %s" --max-count=${MAX_COMMITS} "${PREV_TAG}..HEAD" 2>/dev/null | grep -v "^- Merge" || true)
            echo "找到 ${PREV_TAG}, 共 ${TOTAL_COUNT} 条新 commit"
            if [ "$TOTAL_COUNT" -gt "$MAX_COMMITS" ]; then
              CHANGELOG="${CHANGELOG}"$'\n'"- ...还有 $((TOTAL_COUNT - MAX_COMMITS)) 条更早的更新"
            fi
          else
            CHANGELOG=$(git log --pretty=format:"- %s" -10 | grep -v "^- Merge" || true)
          fi

          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="- 无代码变更(重新构建)"
          fi

          BUILD_TIME=$(date +'%Y-%m-%d %H:%M:%S %Z')
          APK_INFO=$(aapt dump badging "$APK_PATH" 2>/dev/null | grep -E "versionCode|versionName" | head -1 || echo "")
          BUILD_LABEL="${{ steps.buildinfo.outputs.build_label }}"

          cat > /tmp/release_notes.md << EOF
          ## 构建信息
          - 构建时间: ${BUILD_TIME}
          - 版本标签: ${TAG}
          - 构建类型: ${BUILD_LABEL}
          - 版本信息: ${APK_INFO}

          ## 本次更新
          ${CHANGELOG}

          ## 安装说明
          下载 APK 后传输到车机安装即可。
          每次构建 versionCode 自动递增,可直接覆盖安装。
          EOF

          # 若该 tag 已有 release,则覆盖上传 APK(不再 delete+create:
          # 删除期间若创建失败会连旧包一起丢,且会短暂造成下载链接 404)
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在,覆盖上传 APK"
            gh release upload "$TAG" "$APK_PATH" --clobber
            gh release edit "$TAG" --title "科帕奇音乐播放器 ${TAG}" \
              --notes-file /tmp/release_notes.md --latest
          else
            gh release create "$TAG" "$APK_PATH" \
              --target "$GITHUB_SHA" \
              --title "科帕奇音乐播放器 ${TAG}" \
              --notes-file /tmp/release_notes.md \
              --latest
          fi

          # 校验产物确实挂上去了,避免"步骤绿了但没包"的静默失败
          ASSETS=$(gh release view "$TAG" --json assets --jq '.assets | length' 2>/dev/null || echo 0)
          echo "校验 ${TAG}: assets=${ASSETS:-0}"
          if [ "${ASSETS:-0}" -lt 1 ]; then
            echo "::error::Release ${TAG} 未包含 APK 资产,发布失败"
            exit 1
          fi
          echo "正式版发布完成: ${TAG}"
